<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <rect width="160" height="120" rx="4" fill="#F4F1EA"/>
  <!-- Foundation Plinth -->
  <rect x="20" y="86" width="120" height="14" fill="#52796F" stroke="#0A3632" stroke-width="1.8"/>
  <line x1="20" y1="92" x2="140" y2="92" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <!-- Deep Piles under ground -->
  <rect x="36" y="100" width="12" height="12" fill="#0A3632"/>
  <rect x="74" y="100" width="12" height="12" fill="#0A3632"/>
  <rect x="112" y="100" width="12" height="12" fill="#0A3632"/>
  <!-- Structural Columns -->
  <rect x="32" y="24" width="16" height="62" fill="#DDD7CD" stroke="#0A3632" stroke-width="1.8"/>
  <rect x="72" y="24" width="16" height="62" fill="#DDD7CD" stroke="#0A3632" stroke-width="1.8"/>
  <rect x="112" y="24" width="16" height="62" fill="#DDD7CD" stroke="#0A3632" stroke-width="1.8"/>
  <!-- Intermediate Beam -->
  <rect x="28" y="52" width="104" height="10" fill="#EDE8DF" stroke="#0A3632" stroke-width="1.5"/>
  <!-- Top Roof Slab Beam -->
  <rect x="24" y="20" width="112" height="10" fill="#0A3632" stroke="#0A3632" stroke-width="1.5"/>
  <!-- TMT Steel Rebar Grid Lines -->
  <line x1="40" y1="26" x2="40" y2="84" stroke="#A16207" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="80" y1="26" x2="80" y2="84" stroke="#A16207" stroke-width="1.5" stroke-dasharray="2 3"/>
  <line x1="120" y1="26" x2="120" y2="84" stroke="#A16207" stroke-width="1.5" stroke-dasharray="2 3"/>
</svg>
