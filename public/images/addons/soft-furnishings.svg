<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <rect width="160" height="120" rx="4" fill="#F4F1EA"/>
  <!-- Curtain Rod -->
  <line x1="20" y1="20" x2="140" y2="20" stroke="#0A3632" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="20" cy="20" r="3.5" fill="#A16207"/>
  <circle cx="140" cy="20" r="3.5" fill="#A16207"/>
  <!-- Window Glass Behind -->
  <rect x="42" y="26" width="76" height="60" fill="#FFFFFF" stroke="#DDD7CD" stroke-width="1.2"/>
  <line x1="80" y1="26" x2="80" y2="86" stroke="#DDD7CD" stroke-width="1"/>
  <line x1="42" y1="56" x2="118" y2="56" stroke="#DDD7CD" stroke-width="1"/>
  <!-- Left Curtain Drape with Pleats -->
  <path d="M28 20 C32 40 24 70 28 98 C36 98 42 98 48 98 C44 70 52 40 46 20 Z" fill="#52796F" opacity="0.85" stroke="#0A3632" stroke-width="1.2"/>
  <!-- Right Curtain Drape with Pleats -->
  <path d="M132 20 C128 40 136 70 132 98 C124 98 118 98 112 98 C116 70 108 40 114 20 Z" fill="#52796F" opacity="0.85" stroke="#0A3632" stroke-width="1.2"/>
  <!-- Tieback brass rings -->
  <path d="M26 62 Q36 65 44 60" stroke="#A16207" stroke-width="2"/>
  <path d="M134 62 Q124 65 116 60" stroke="#A16207" stroke-width="2"/>
  <!-- Cushion in foreground -->
