<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <rect width="160" height="120" rx="4" fill="#F4F1EA"/>
  <!-- Ceiling drop cove -->
  <rect x="20" y="20" width="120" height="70" rx="2" fill="#FFFFFF" stroke="#0A3632" stroke-width="1.8"/>
  <rect x="36" y="32" width="88" height="46" rx="2" fill="#EDE8DF" stroke="#0A3632" stroke-width="1.5"/>
  <!-- Ambient Cove Glow -->
  <rect x="33" y="29" width="94" height="52" rx="3" stroke="#D4A373" stroke-width="2" opacity="0.6"/>
  <!-- Downlights -->
  <circle cx="48" cy="44" r="4" fill="#A16207"/>
  <circle cx="112" cy="44" r="4" fill="#A16207"/>
  <circle cx="48" cy="66" r="4" fill="#A16207"/>
  <circle cx="112" cy="66" r="4" fill="#A16207"/>
  <!-- Center light fixture / fan line -->
  <circle cx="80" cy="55" r="7" stroke="#0A3632" stroke-width="1.5" fill="#FFFFFF"/>
  <circle cx="80" cy="55" r="2.5" fill="#A16207"/>
  <!-- Light rays -->
  <line x1="80" y1="65" x2="80" y2="80" stroke="#A16207" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="70" y1="62" x2="60" y2="76" stroke="#A16207" stroke-width="1.2" stroke-dasharray="2 3"/>
  <line x1="90" y1="62" x2="100" y2="76" stroke="#A16207" stroke-width="1.2" stroke-dasharray="2 3"/>
</svg>
