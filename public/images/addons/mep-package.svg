<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <rect width="160" height="120" rx="4" fill="#F4F1EA"/>
  <!-- Wall cutaway -->
  <rect x="25" y="20" width="110" height="80" rx="2" fill="#FFFFFF" stroke="#0A3632" stroke-width="1.8"/>
  <!-- Electrical Conduits (Warm Ochre lines) -->
  <path d="M35 20 L35 48 L70 48 L70 75 L105 75 L105 100" stroke="#A16207" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Junction Box / Circuit Breaker -->
  <rect x="62" y="40" width="16" height="16" rx="2" fill="#0A3632"/>
  <circle cx="70" cy="48" r="2" fill="#25D366"/>
  <!-- Plumbing Pipe (Deep Teal / Blue lines) -->
  <path d="M115 20 L115 55 L85 55 L85 100" stroke="#52796F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pressure Valve / Joint -->
  <circle cx="85" cy="55" r="4" fill="#EDE8DF" stroke="#0A3632" stroke-width="1.5"/>
  <line x1="81" y1="55" x2="89" y2="55" stroke="#A16207" stroke-width="1.5"/>
  <!-- Water Flow droplet -->
  <circle cx="85" cy="72" r="1.5" fill="#52796F"/>
  <circle cx="85" cy="84" r="1.5" fill="#52796F"/>
  <!-- Power Spark indicator -->
  <path d="M35 34 L37 38 L33 39 L36 43" stroke="#D4A373" stroke-width="1.2"/>
</svg>
