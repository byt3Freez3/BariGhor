<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <rect width="160" height="120" rx="4" fill="#F4F1EA"/>
  <!-- Wardrobe Frame -->
  <rect x="25" y="18" width="110" height="84" rx="2" fill="#FFFFFF" stroke="#0A3632" stroke-width="2"/>
  <!-- 3 Sliders/Doors -->
  <rect x="29" y="22" width="32" height="76" fill="#F9F7F1" stroke="#0A3632" stroke-width="1.2"/>
  <rect x="64" y="22" width="32" height="76" fill="#EDE8DF" stroke="#0A3632" stroke-width="1.2"/>
  <rect x="99" y="22" width="32" height="76" fill="#F9F7F1" stroke="#0A3632" stroke-width="1.2"/>
  <!-- Vertical Fluting Accents -->
  <line x1="72" y1="26" x2="72" y2="94" stroke="#A16207" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="80" y1="26" x2="80" y2="94" stroke="#A16207" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="88" y1="26" x2="88" y2="94" stroke="#A16207" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- Sleek brass profile handles -->
  <line x1="57" y1="50" x2="57" y2="70" stroke="#A16207" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="50" x2="68" y2="70" stroke="#A16207" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="127" y1="50" x2="127" y2="70" stroke="#A16207" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top loft division -->
  <line x1="29" y1="38" x2="131" y2="38" stroke="#0A3632" stroke-width="1.2"/>
</svg>
