<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none">
  <rect width="160" height="120" rx="4" fill="#F4F1EA"/>
  <!-- Wall Touch Control Panel -->
  <rect x="36" y="20" width="88" height="80" rx="6" fill="#0A3632" stroke="#A16207" stroke-width="1.8"/>
  <rect x="42" y="26" width="76" height="68" rx="3" fill="#143E3A"/>
  <!-- Screen Elements -->
  <!-- WiFi / Scene Status icon -->
  <circle cx="56" cy="40" r="3" fill="#25D366"/>
  <line x1="64" y1="40" x2="106" y2="40" stroke="#D4A373" stroke-width="1.5"/>
  <!-- 4 Scene Touch Tiles -->
  <rect x="50" y="48" width="28" height="18" rx="2" fill="#0A3632" stroke="#52796F" stroke-width="1"/>
  <circle cx="64" cy="57" r="3" fill="#A16207"/>
  <rect x="82" y="48" width="28" height="18" rx="2" fill="#0A3632" stroke="#52796F" stroke-width="1"/>
  <!-- Temperature reading -->
  <text x="96" y="60" font-family="sans-serif" font-size="8" fill="#F9F7F1" text-anchor="middle">24°C</text>
  <!-- Slider bar for dimming -->
  <line x1="50" y1="76" x2="110" y2="76" stroke="#234E4A" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="88" y2="76" stroke="#A16207" stroke-width="3" stroke-linecap="round"/>
  <circle cx="88" cy="76" r="4" fill="#F9F7F1" stroke="#A16207" stroke-width="1.5"/>
  <line x1="50" y1="86" x2="70" y2="86" stroke="#D4A373" stroke-width="1"/>
</svg>
