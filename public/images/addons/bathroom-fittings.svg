  <rect x="52" y="16" width="56" height="42" rx="28" fill="#FFFFFF" stroke="#0A3632" stroke-width="1.8"/>
  <rect x="49" y="13" width="62" height="48" rx="31" stroke="#D4A373" stroke-width="1.5" opacity="0.5"/>
  <!-- Vanity Countertop -->
  <rect x="30" y="66" width="100" height="6" rx="1" fill="#0A3632"/>
  <!-- Vanity Cabinet -->
  <rect x="34" y="72" width="92" height="28" rx="1" fill="#EDE8DF" stroke="#0A3632" stroke-width="1.5"/>
  <!-- Basin Bowl -->
  <path d="M60 66 Q80 78 100 66 Z" fill="#FFFFFF" stroke="#0A3632" stroke-width="1.5"/>
